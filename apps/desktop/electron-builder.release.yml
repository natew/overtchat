extends: ./electron-builder.yml
forceCodeSigning: true
# Private signed updater baseline; never publish this branch's artifacts.
publish:
  provider: generic
  url: http://127.0.0.1:4931/
electronFuses:
  enableNodeCliInspectArguments: false
mac:
  target:
    - dmg
    - zip
  artifactName: overtchat-${version}-mac-${arch}.${ext}
  notarize: true
dmg:
  sign: true
